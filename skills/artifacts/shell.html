<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<style>
{{theme}}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
  --card:color-mix(in srgb,var(--fg) 4%,var(--bg));
  --line:color-mix(in srgb,var(--border-muted) 45%,var(--bg));
  --measure:70ch;
  --page:1760px;
  --pad:clamp(16px,3vw,56px);
  --gap:clamp(28px,3vw,56px);
  --end:40px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:clamp(16px,14px + .25vw,18px)/1.6 var(--sans)}
/* the page takes the width of the screen, up to --page, with one left edge for every part.
   Two tracks: the main track holds text at a readable measure; the side track takes the rest of the width.
   A .split puts its first child in the main track and its second child in the side track.
   Tables, figures, code, grids, cards and widgets take both tracks. Under 1080 px, one track: a .split stacks. */
main{max-width:var(--page);margin:0 auto;padding:28px var(--pad) var(--end);container:page/inline-size}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px var(--gap);align-items:start;margin:8px 0 16px}
.split>*>:first-child{margin-top:0}
.split>*>:last-child{margin-bottom:0}
@container page (min-width:1080px){.split{grid-template-columns:minmax(0,var(--measure)) minmax(0,1fr)}}
a{color:var(--md-link)}
code{font:.86em var(--mono);color:var(--md-code);background:var(--sunk);padding:1px 6px;border-radius:6px}
strong,b{color:var(--fg)}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}

:where(p,ul,ol,blockquote,h1,h2,h3,h4,dl){max-width:var(--measure)}
h1{font-size:clamp(28px,4.2vw,42px);line-height:1.12;margin:6px 0 14px;color:var(--fg);letter-spacing:-.02em}
h2{font-size:24px;margin:30px 0 12px;color:var(--fg);letter-spacing:-.01em}
h3{font-size:18px;margin:22px 0 8px;color:var(--fg)}
p{margin:0 0 12px}
ul,ol{padding-left:22px;margin:0 0 12px}
li{margin:4px 0}
li::marker{color:var(--md-list-bullet)}
blockquote{margin:8px 0 12px;padding:9px 13px;background:var(--user-message-bg);border-left:3px solid var(--accent);border-radius:8px;color:var(--fg)}
blockquote p{margin:0}
.tw{overflow-x:auto;margin:8px 0 16px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--card);color:var(--fg)}

/* code and figures */
pre.code{background:var(--sunk);border:1px solid var(--md-code-block-border);border-radius:10px;padding:12px 14px;overflow-x:auto;font:13px/1.55 var(--mono);color:var(--text);margin:8px 0 14px}
pre.code code{background:none;padding:0;color:inherit;font:inherit}
.diff .add{color:var(--tool-diff-added)} .diff .del{color:var(--tool-diff-removed)} .diff .ctx{color:var(--tool-diff-context)}
.fig{margin:10px 0 16px;padding:12px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.fig svg{display:block;margin:0 auto;max-width:100%;height:auto}
/* a Pele diagram reads these variables, so it takes the page colors */
.fig{--pele-bg:transparent;--pele-fg:var(--text);--pele-muted:var(--muted);--pele-line:var(--border-muted);--pele-surface:var(--card);--pele-surface-alt:var(--selected-bg);--pele-border:var(--border);--pele-accent:var(--accent);--pele-error:var(--error);--pele-critical:var(--error);--pele-font:var(--sans);--pele-font-mono:var(--mono);--pele-radius:8px}
img{max-width:100%;height:auto;border-radius:8px}

/* parts that a page may use */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px 28px;align-items:start}
.grid>*>:first-child{margin-top:0}
/* a stepper: ordered steps, all in view, with li.done and li.now. A timeline: events in time order, each li starts with a <time>.
   Both keep the left edge of the column: the marks sit in the padding of each li, on one line from top to bottom. */
ol.stepper,ol.timeline{list-style:none;padding:0;margin:8px 0 16px}
ol.stepper{counter-reset:step}
ol.stepper>li,ol.timeline>li{position:relative;margin:0;padding:0 0 14px 40px}
:is(ol.stepper,ol.timeline)>li:last-child{padding-bottom:0}
ol.stepper>li{counter-increment:step}
ol.stepper>li::before{content:counter(step);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:600 13px/1 var(--mono);color:var(--muted);background:var(--sunk);border:1px solid var(--border-muted)}
ol.stepper>li.done{color:var(--muted)}
ol.stepper>li.done::before{content:"\2713";color:var(--bg);background:var(--success);border-color:var(--success)}
ol.stepper>li.now{color:var(--fg)}
ol.stepper>li.now::before{color:var(--bg);background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,var(--bg))}
ol.timeline>li::before{content:"";position:absolute;left:9px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
ol.timeline>li>time:first-child{display:block;font:600 12px/1.6 var(--mono);color:var(--muted)}
:is(ol.stepper,ol.timeline)>li:not(:last-child)::after{content:"";position:absolute;left:13px;top:31px;bottom:3px;border-left:2px solid var(--border-muted)}
ol.timeline>li:not(:last-child)::after{top:18px;bottom:-2px}
.muted{color:var(--muted)}
/* hierarchy: a kicker above a heading, a lead line under it, and pills for a state */
.kicker{font:600 12px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:36px 0 4px}
.kicker+h2,.kicker+h3{margin-top:0}
.lead{font-size:1.08em;color:var(--muted)}
.pill{display:inline-block;font:600 12px/1.6 var(--mono);padding:0 7px;border-radius:6px;color:var(--muted);background:var(--sunk)}
.pill.good{color:var(--success);background:color-mix(in srgb,var(--success) 14%,var(--bg))}
.pill.warn{color:var(--warning);background:color-mix(in srgb,var(--warning) 14%,var(--bg))}
.pill.bad{color:var(--error);background:color-mix(in srgb,var(--error) 14%,var(--bg))}
/* a term in the color of a series, as the widgets draw it: .term.s1 to .term.s4 */
.term{--c:var(--fg);font:600 .86em var(--mono);padding:1px 7px;border-radius:6px;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.term.s1{--c:var(--series-1)} .term.s2{--c:var(--series-2)} .term.s3{--c:var(--series-3)} .term.s4{--c:var(--series-4)}
button{font:600 15px var(--sans);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:40px;cursor:pointer;background:var(--sunk);color:var(--fg)}
button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}
textarea,input[type=text]{width:100%;background:var(--sunk);color:var(--fg);border:1px solid var(--border-muted);border-radius:10px;padding:9px 11px;font:15px/1.5 var(--sans)}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--accent)}

/* the way back: a bar at the bottom with the block that Copy gives */
.bar{position:sticky;bottom:0;z-index:30;display:flex;align-items:center;gap:12px;margin:24px calc(-1 * var(--pad)) calc(-1 * var(--end));padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.bar .line{flex:1;min-width:0;font:13px/1.45 var(--mono);color:var(--fg);background:var(--sunk);border-radius:8px;padding:8px 10px;max-height:7.5em;overflow:auto;white-space:pre-wrap;word-break:break-word}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font:600 14px var(--sans);padding:8px 14px;border-radius:99px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
.toast.on{opacity:1}
[x-cloak]{display:none!important}
/* Clear: it asks again in the page, not with confirm(), which some hosts block */
.reset{margin:16px 0 0;color:var(--muted);font-size:14px}
.reset a{cursor:pointer;color:var(--muted);text-decoration:none}
.reset .yes{color:var(--error);font-weight:600;margin:0 8px}

/* phone: wide figures scroll sideways (Pele sets max-width inline, so it needs !important), and the bar keeps one row */
@media (max-width:700px){
  .fig svg{max-width:none!important}
  .bar .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}

/* share: a light copy for other people, and for print */
body.share .bar,body.share .reset,body.share .toast,body.share .no-share{display:none}
@page{size:A4;margin:16mm}
@media print{
  .bar,.reset,.toast,.no-share{display:none}
  body{font-size:11pt}
  main{padding:0}
  .fig,table,.card,blockquote{break-inside:avoid}
  h2,h3{break-after:avoid}
}
</style>
{{head}}
</head>
<body class="{{bodyClass}}" data-page="{{slug}}" data-key="{{key}}">
<main>
{{body}}
<!-- the bar of the way back: the block that Copy gives, and Send in a host that has sendPrompt.
     It shows once the page uses the way back, with a field or a part. Clear sits above it, once a field differs from its default.
     Without Alpine, x-cloak keeps both hidden. -->
<p class="reset" x-data x-show="$store.back.edited" x-cloak><a href="#" x-show="!$store.back.clearing" @click.prevent="$store.back.askClear()">Clear my edits</a><span x-show="$store.back.clearing" x-cloak>Clear your edits? <a href="#" class="yes" @click.prevent="$store.back.clear()">Yes</a> <a href="#" @click.prevent="$store.back.clearing = false">No</a></span></p>
<div class="bar" x-data x-show="$store.back.used" x-cloak>
  <div class="line" x-text="$store.back.text"></div>
  <button class="primary" x-show="typeof sendPrompt === 'function'" x-cloak @click="sendPrompt($store.back.text)">Send</button><button class="primary" @click="$store.back.copy()">Copy</button>
</div>
</main>
<!-- the toast of Copy: empty and hidden on a page without Alpine -->
<div class="toast" x-data :class="$store.back.toast && 'on'" x-text="$store.back.toast"></div>
{{alpine}}
</body>
</html>
